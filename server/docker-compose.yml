services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - cache:/data/cache
      - ./cookies:/data/cookies:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  cache:
  caddy_data:
  caddy_config:
